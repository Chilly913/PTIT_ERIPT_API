name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eript
          POSTGRES_USER: eript
          POSTGRES_PASSWORD: eript
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eript -d eript"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: eript
      DB_USERNAME: eript
      DB_PASSWORD: eript
      TEST_DATABASE_URL: postgres://eript:eript@127.0.0.1:5432/eript?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: |
          go build -o bin/server ./cmd/server
          go build -o bin/cli ./cmd/cli
          go build -o bin/worker ./cmd/worker
      - name: migrations up / down / up
        run: |
          ./bin/cli migrate up
          ./bin/cli migrate version
          ./bin/cli migrate down all
          ./bin/cli migrate up

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ptit-eript-api:ci
